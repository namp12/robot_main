amcl:
  ros__parameters:
    use_sim_time: false
    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    initial_cov_xx: 0.25
    initial_cov_yy: 0.25
    initial_cov_aa: 0.06853891909122467
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    laser_sigma_hit: 0.2
    laser_z_hit: 0.95
    laser_z_short: 0.05
    laser_z_max: 0.05
    laser_z_rand: 0.5
    max_particles: 2000
    min_particles: 200
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    set_initial_pose: true
    tf_broadcast: true
    transform_tolerance: 0.8
    update_min_d: 0.1
    update_min_a: 0.2
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
