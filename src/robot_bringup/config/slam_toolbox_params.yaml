# slam_toolbox_params.yaml
# Optimized parameters for RPLidar C1 on Raspberry Pi 4 (ROS2 Humble)
# Location: /home/phuongnam/robot_main/src/robot_bringup/config/slam_toolbox_params.yaml

slam_toolbox:
  ros__parameters:

    # ---- Plugin ----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: Huber

    # ---- Threading ----
    thread_num: 2

    # ---- Frame IDs ----
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true

    # ---- Motion / scan thresholds ----
    minimum_travel_distance: 0.40
    minimum_travel_heading: 0.40
    scan_buffer_maximum_size: 10
    scan_buffer_size: 10
    scan_publisher_maximum_size: 10

    # ---- Laser parameters (RPLidar C1) ----
    max_laser_range: 12.0
    minimum_time_interval: 0.1

    # ---- Map resolution & Update rate ----
    resolution: 0.05
    map_update_interval: 5.0

    # ---- Transform ----
    transform_publish_period: 0.1
    transform_timeout: 0.5

    # ---- Loop closure ----
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_search_maximum_error: 0.8
    loop_search_space_dimension: 4.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    # ---- Graph Decimation (RPi4 CPU Optimization) ----
    max_covariance_decimation: 3
    max_nodes_decimation: 2

    # ---- Debug ----
    debug_logging: false
