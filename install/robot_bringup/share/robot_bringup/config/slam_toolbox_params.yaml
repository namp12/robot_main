# slam_toolbox_params.yaml
# Optimized parameters for RPLidar C1 on Raspberry Pi 4 (ROS2 Humble)
# Location: e:\robot_main\src\robot_bringup\config\slam_toolbox_params.yaml

slam_toolbox:
  ros__parameters:

    # ---- Plugin ----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: Huber  # Changed: Huber loss helps reject laser outlier noise

    # ---- Threading ----
    thread_num: 2  # Keep 2 cores free on RPi4 for WebSocket and control nodes

    # ---- Frame IDs ----
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true

    # ---- Motion / scan thresholds ----
    minimum_travel_distance: 0.1     # Changed from 0.2 to capture fine details
    minimum_travel_heading: 0.1      # Changed from 0.2 (~5.7 deg) for smooth rotation
    scan_buffer_maximum_size: 10     # Optimizes RAM usage on RPi4
    scan_buffer_size: 10
    scan_publisher_maximum_size: 10

    # ---- Laser parameters (RPLidar C1) ----
    max_laser_range: 12.0            # C1 hardware maximum limit
    minimum_time_interval: 0.05      # Max rate limiting at 20 Hz

    # ---- Map resolution & Update rate ----
    resolution: 0.05                 # 5 cm per pixel (standard balanced resolution)
    map_update_interval: 2.0         # Added: throttles map publishing to save CPU and network bandwidth

    # ---- Transform ----
    transform_publish_period: 0.05   # Publish map->odom transform at 20 Hz
    transform_timeout: 0.2

    # ---- Loop closure ----
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_search_maximum_error: 1.2   # Changed from 2.0 to prevent false-positive loop closures
    loop_search_space_dimension: 8.0  # Added: limits Ceres search space to optimize CPU

    # ---- Graph Decimation (RPi4 CPU Optimization) ----
    max_covariance_decimation: 2     # Added: decimates covariance calculations to prevent CPU spikes
    max_nodes_decimation: 1

    # ---- Debug ----
    debug_logging: false
